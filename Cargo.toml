[package]
name = "voice_changer_gui"
version = "0.4.0"
edition = "2021"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
eframe = "0.27"
rfd = "0.14"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.5"
tray-icon = "0.14"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
